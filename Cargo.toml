[package]
name = "pocket"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
dirs = "7.0.0"
flate2 = "1"
fontdue = "0.9"
futures-util = "0.3.34"
glam = "0.33.11"
misaki-rs = { version = "0.6.0", default-features = false }
naga = { version = "30.0.1", features = ["wgsl-in"] }
ort = "2.0.0-rc.14"
oxc_allocator = "0.152.0"
oxc_ast = "0.152.0"
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
oxc_syntax = "0.152.0"
parking_lot = "0.12.5"
pollster = "1.0.1"
postcard = { version = "1", features = ["use-std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
rsworld = "0.1.0"
rsworld-sys = "0.1.0"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
wgpu = "30.0.1"
whisper-rs = { version = "0.16", features = ["metal"] }
winit = "0.30.13"

[features]
# Long scenarios (a village day, a meadow fire fought, generations of
# wolves, a crowd at speed): `cargo test --features slow-tests`.
slow-tests = []

[profile.release]
opt-level = 3
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
